name: Build Dummy Studio (Windows)
on:
  workflow_dispatch:
  push:
    paths: ['studio/**', '.github/workflows/studio-win.yml']   # แก้ workflow นี้ก็ build ใหม่ด้วย
jobs:
  win:
    runs-on: windows-latest
    permissions:
      contents: write       # ต้องใช้สร้าง Release · ไม่ได้ให้สิทธิ์อื่นเพิ่ม
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      # โปรเจกต์ Dummy Online จริง (ใช้เป็นข้อมูลทดสอบ) — ลงในโฟลเดอร์ย่อย ไม่ปนกับ repo ของสตูดิโอ
      - name: Checkout Dummy-Online
        uses: actions/checkout@v4
        with:
          repository: l3lackshine/Dummy-Online        # <-- แก้เป็น owner/repo จริง 
          path: dummy-online

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: ทดสอบแกนข้อมูลกับโปรเจกต์จริง
        run: npm test
        env:
          DUMMY_ROOT: ${{ github.workspace }}/dummy-online
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: DummyStudio-win
          path: studio/dist/*.exe

      # ---------- ขึ้น Release (เฉพาะ main) ----------
      # เลขเวอร์ชันมาจาก studio/package.json: ยังไม่มี Release ของเลขนี้ = สร้างใหม่ (สร้าง tag v<เลข> ให้เอง)
      # มีแล้ว = ข้าม · ออกเวอร์ชันใหม่ = แก้ version ใน package.json แล้ว push เข้า main
      # (ไม่ใช้การดัน tag เพราะเครื่องมือที่ Claude ใช้ดัน tag ขึ้น GitHub ไม่ได้)
      - name: ขึ้น Release ถ้าเวอร์ชันนี้ยังไม่มี
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "มี Release $TAG แล้ว — ข้าม (ออกใหม่ต้องเปลี่ยน version ใน studio/package.json)"
            exit 0
          fi
          gh release create "$TAG" dist/*.exe \
            --target "$GITHUB_SHA" \
            --title "Dummy Studio $TAG" \
            --notes-file ../RELEASE_NOTES.md \
            --generate-notes
